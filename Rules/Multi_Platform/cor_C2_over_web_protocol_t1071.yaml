title: Potential C2 over web protocol (Endpoint)
name: edr_alert
id: 204d4b9d-f9fc-43c7-ae70-1f3b8c487c16
status: experimental
description: >
  Detects Crowdstrike/SentinelOne alerts of behavior that might indicate C2 traffic over web protocols.
references:
  - https://attack.mitre.org/techniques/1071/001/
author: Louis Ingelbrecht
date: 2026-05-27
tags:
  - attack.command_and_control
  - attack.t1071
  - attack.t1071.001
logsource:
  category: alert
detection:
  selection:
    rule.name: 'C2 Over Web Protocol'
  condition: selection
