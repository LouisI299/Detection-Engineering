    action.name: accept
  condition: selection
---
title: Potential exfiltration over non-c2 protocol (correlation)
id: 72bba9e9-20a1-47b5-9693-c5a0323891cf
status: experimental
description: >
  Correlates endpoint detection (external ip connection by suspicious process) with data transfer of more than 20mb (fortigate detection) indicating exfiltration of data.
references:
  - https://attack.mitre.org/techniques/1048/003/
author: Louis Ingelbrecht
date: 2026-05-26
tags:
  - attack.reconnaissance
  - attack.t1048
  - attack.t1048.003
correlation:
  type: temporal
  rules:
    - edr_alert
    - fortigate_exfiltration
  aliases:
    source.ip:
      edr_alert: sentinelone.data.srcip
      fortigate_exfiltration: source.ip
  group-by:
    - source.ip
  timespan: 1m
level: high