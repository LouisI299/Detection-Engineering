title: Potential exfiltration (Firewall)
name: fortigate_exfiltration
id: 6bc4121a-807c-4a54-a85a-97d12e8c051f
status: experimental
description: >
  Detects more than 20mb being transferred
references:
  - https://attack.mitre.org/techniques/1048/003/
author: Louis Ingelbrecht
date: 2026-05-26
tags:
  - attack.exfiltration
  - attack.t1048
