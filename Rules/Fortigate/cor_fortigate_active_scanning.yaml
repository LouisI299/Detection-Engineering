title: Server reset traffic (base rule)
name: server_rst_traffic
id: 63aac89e-df6f-44a4-b661-fd9224992fbc
status: experimental
description: >
  Detects server-rst connections, for use in active scanning correlation.
references:
  - https://attack.mitre.org/techniques/T1595/
author: Louis Ingelbrecht
date: 2026-05-19
tags:
  - attack.reconnaissance
  - attack.t1595
logsource:
  product: firewall
detection:
  selection:
    event.action: server-rst
  condition: selection
level: informational
fields:
  - event.action
---
title: Active Scanning
name: active_scanning
id: dcc4e15f-2e35-47c4-8228-01d397e477ec
status: experimental
description: >
  Detects multiple server reset events, coming from a single source ip, 
  targeting a single destination ip on different ports, within a short timeframe.
references:
  - https://attack.mitre.org/techniques/T1595/
author: Louis Ingelbrecht
date: 2026-05-19
tags:
  - attack.reconnaissance
  - attack.t1595
correlation:
  type: value_count
  rules:
    - server_rst_traffic
  group-by:
    - source.ip
    - destination.ip
  field: destination.port
  timespan: 5m
  condition:
    gte: 20
level: high