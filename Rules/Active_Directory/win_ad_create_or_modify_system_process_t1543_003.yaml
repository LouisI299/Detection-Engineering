title: Create or Modify System Process - Windows Service
id: 61b0eb40-1f2b-4542-8ad6-293338b91879
status: experimental
description: >
  Detects modification of an existing service to persist on the system.
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.persistence
  - attack.t1543
  - attack.t1543.003
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    EventID: 13
    Image|endswith: reg.exe
    Details|endswith: dll
  condition: selection AND NOT filter_admins
falsepositives:
  - Unknown
fields:
  - EventID
  - Image
  - User
  - Details
