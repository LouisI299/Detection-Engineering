title: Windows Management Instrumentation - WMI
id: 208b3a64-c966-4099-8532-62b97c849f4d
status: experimental
description: >
  Detects scripts used to delete shadow copies to inhibit the recovery of a corrupted system.
references:
  - https://attack.mitre.org/techniques/T1490
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.execution
  - attack.t1490
logsource:
  product: windows
  service: wmi
detection:
  selection:
    EventID: 5857
    Message|endswith: vsswmi.dll
  condition: selection
falsepositives:
  - Administrator removing shadow copies
fields:
  - User
  - EventID
  - Message
