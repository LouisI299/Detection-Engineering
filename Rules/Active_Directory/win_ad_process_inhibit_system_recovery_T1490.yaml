title: Windows Management Instrumentation - Process Creation
id: 2e3c3d3f-a25a-473a-a5b8-3dcb3d30b1c5
status: experimental
description: >
  Detects deletion of shadow copies to inhibit the recovery of a corrupted system.
references:
  - https://attack.mitre.org/techniques/T1490
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.execution
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 1
    Image|endswith:
      - vssadmin.exe
      - diskshadow.exe
    CommandLine|contains:
      - delete shadows
      - /quiet
  condition: selection
falsepositives:
  - Administrator removing shadow copies
fields:
  - User
  - Image
  - Commandline
