title: Event Triggered Execution - Windows Management Instrumentation Event Subscription - File Creation
id: ad81470f-594d-48a3-8823-dbd9778c37c4
status: experimental
description: >
  Detects adversaries compiling WMI scripts using mofcomp
   to create malicious subscribtions.
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.privilege_escalation
  - attack.t1546
  - attack.t1546.003
logsource:
  category: file_creation
  product: windows
detection:
  selection_1:
    EventID: 11
    Image|endswith: mofcomp.exe
  selection_2:
    EventID: 11
    Image|not|endswith: trusted_installer.exe
    TargetFileName|startswith: C:\Windows\System32\wbem\MOF
  condition: selection
fields:
  - EventID
  - Image
  - TargetFileName

