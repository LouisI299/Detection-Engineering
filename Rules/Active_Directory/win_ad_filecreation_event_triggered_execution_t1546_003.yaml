title: Event Triggered Execution - Windows Management Instrumentation Event Subscription - File Creation
id: ad81470f-594d-48a3-8823-dbd9778c37c4
status: experimental
description: >
  Detects adversaries compiling WMI scripts using mofcomp
   to create malicious subscribtions.
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.privilege_escalation
  - attack.t1546
  - attack.t1546.003
logsource:
  category: file_creation
  product: windows
detection:
  selection_1:
    action.id: 11
    process.name: mofcomp.exe
  selection_2:
    action.id: 11
    file.path|startswith: C:\Windows\System32\wbem\MOF
  filter_trusted_process:
    process.name: trusted_installer.exe
  condition: selection_1 or selection_2 and not filter_trusted_process
fields:
  - action.id
  - process.name
  - file.path

