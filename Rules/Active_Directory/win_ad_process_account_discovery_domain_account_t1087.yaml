title: Account Discovery - Domain Account - Command Line
id: df92d29e-a57b-422a-a128-8594d72fdd02
status: experimental
description: >
  Detects adversaries using command-line tools to discover AD users and groups.
  This rule filters out known administrative accounts to reduce false positives.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://lolad-project.github.io/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    action.id: 1
    process.name:
      - net.exe
      - net1.exe
      - nltest.exe
      - dsquery.exe
  filter_admins:
    User.name|contains:
      - admin
      - svc
      - AUTHORITY\SYSTEM
  condition: selection AND NOT filter_admins
falsepositives:
  - Unknown
fields:
  - process.Commandline
  - process.name
  - user.name
