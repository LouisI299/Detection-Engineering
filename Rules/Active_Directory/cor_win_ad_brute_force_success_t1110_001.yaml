description: >
  Detects multiple logon attempts targeting a single user within a short timeframe,
  followed by a succesful logon event coming from the same IP (succesful bruteforce attack)
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
action: correlation
type: temporal
rule:
  - many_failed_logins
  - login_success
