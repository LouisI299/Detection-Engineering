title: Windows Management Instrumentation - Powershell Script
id: 210dee09-b3e3-4389-a67e-f7e572758b0a
status: experimental
description: >
  Detects scripts used to delete shadow copies to inhibit the recovery of a corrupted system.
references:
  - https://attack.mitre.org/techniques/T1490
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.execution
  - attack.t1490
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    EventID: 4104
    ScriptBlockText|contains:
      - delete shadows
  condition: selection
falsepositives:
  - Administrator removing shadow copies
fields:
  - User
  - Image
  - ScriptBlockText
