title: Windows Management Instrumentation - Process Creation
id: 224d58f1-f10e-40e4-b502-18fd2a36d2c1
status: experimental
description: >
  Abuse of WMI to execute malicious commands and payloads.
references:
  - https://attack.mitre.org/techniques/T1047
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.execution
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    EventID: 1
    ParentImage|endswith: 
      - wmic.exe
      - WmiPrvSE.exe
    Image|endswith:
      - notepad.exe
      - calc.exe
      - cmd.exe
      - powershell.exe
      - pwsh.exe
      - rundll32.exe
      - msiexec.exe
  selection_cli:
    ParentImage|endswith:
      - cmd.exe
      - powershell.exe
      - pwsh.exe
    CommandLine|contains:
      - wmic
      - Invoke-CimMethod
      - Invoke-WmiMethod
    CommandLine|contains:
      - process call create
      - os get /FORMAT  
  condition: selection_process OR selection_CLI
falsepositives:
  - Legitimate system administration scripts
fields:
  - EventID
  - Image
  - ParentImage
  - CommandLine
  - AccountName
