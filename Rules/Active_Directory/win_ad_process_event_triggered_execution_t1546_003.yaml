title: Event Triggered Execution - Windows Management Instrumentation Event Subscription - Process Creation
id: db57f33c-5a4c-4c35-a799-8220f6fb335b
status: experimental
description: >
  Detects adversaries compiling WMI scripts using mofcomp
   to create malicious subscribtions.
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.privilege_escalation
  - attack.t1546
  - attack.t1546.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    action.id: 1
    process.name: mofcomp.exe
    process.parent.name: 
    - powershell.exe
    - pwsh.exe
  condition: selection
fields:
  - action.id
  - process.name
  - process.parent.name
  - CommandLine

