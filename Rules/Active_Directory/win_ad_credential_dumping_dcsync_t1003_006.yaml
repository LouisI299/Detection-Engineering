title: OS Credential Dumping - DCSync
id: e31ab61b-d7fa-4a53-9310-26d92f1a1745
status: experimental
description: >
  Abusing domain controller's API to simulate replication process from remote domain controller to pull password hashes from Active Directory, which can be used to create a Golden Ticket. Detects Windows 4662 (Directory Service Access) events where the requesting user is not a machine account (does not end in $).
references:
  - https://attack.mitre.org/techniques/T1003/006/
  - https://hacktricks.wiki/en/windows-hardening/active-directory-methodology/dcsync.html
author: Louis Ingelbrecht
date: 2026-05-15
tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    SubjectUserName|not|endswith: $
  condition: selection
falsepositives:
  - Legitimate secondary Domain Controllers syncing data (if misconfigured to not use $ accounts)
fields:
  - EventID
  - SubjectUserName
  - ObjectName
  - Properties
