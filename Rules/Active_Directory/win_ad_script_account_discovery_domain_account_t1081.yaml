title: Account Discovery - Domain Account - Powershell Script
id: bae81fc1-01af-4ce6-8878-265170991cf8
status: experimental
description: >
  Detects adversaries using powershell scripts to discover AD users and groups.
  This rule filters out known administrative accounts to reduce false positives.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://lolad-project.github.io/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1087.002
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    action.id: 4104
    process.name:
      - powershell.exe
      - pwsh.exe
    action.properties.ScriptBlockText|contains:
      - Get-AD
      - Search-AD
  filter_admins:
    user.name|contains:
      - admin
      - svc
      - AUTHORITY\SYSTEM
  condition: selection AND NOT filter_admins
falsepositives:
  - Unknown
fields:
  - action.properties.ScriptBlockText
  - process.name
  - user.name
