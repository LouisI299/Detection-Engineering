title: Abuse of Domain Accounts 
id: c914d548-f2a0-40bc-bc61-4f76d77503e9
status: experimental
description: >
  Detects user logon events, link rule to a schedule in SIEM, to only alert if users are logging in at unusual times.
references:
  - https://attack.mitre.org/techniques/T1078/002/
author: Louis Ingelbrecht
date: 2026-05-15
tags:
  - attack.initial_access
  - attack.t1078
  - attack.t1078.002
logsource:
  product: windows
  service: security
detection:
  selection:
    action.id: 4624
    action.properties.LogonType:
      - 7
      - 10
  Filter_machine_accounts:
    user.target.name|endswith: $
  filter_system_accounts:
    user.target.name: 
      - SYSTEM
      - LOCAL SERVICE
      - REMOTE SERVICE
  non_working_hours:
    timestamp|timerange: 17:00-09:00
  non_working_days:
    timestamp|day_of_week:
      - saturday
      - sunday
  non_working_dates:
    timestamp|public_holiday_in: BE
  condition: selection and not 1 of filter* and (non_working_hours or non_working_days or non_working_dates)
level: medium
fields:
  - action.id
  - user.target.name
  - action.properties.LogonType
  - timestamp
---
title: Abuse of Domain Accounts - Multihost Remote Logon
id: 80d72138-06d2-45dd-9db4-5f7ef3bc63f2
status: experimental
description: >
  Detects single domain user account initiating remote logons from multiple IP addresses within a short timeframe.
references:
  - https://attack.mitre.org/techniques/T1078/002/
author: Louis Ingelbrecht
date: 2026-05-15
tags:
  - attack.initial_access
  - attack.t1078
  - attack.t1078.002
correlation:
  type: value_count
  rules:
    - remote_logon
  group-by:
    - user.target.name
  timespan: 5m
  condition:
    gte: 3
    field: source.ip
level: high