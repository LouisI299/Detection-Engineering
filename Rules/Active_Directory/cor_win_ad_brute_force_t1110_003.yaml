title: Windows Single Failed Logon (Base Rule)
name: failed_logon
id: cd3119ae-8a93-4648-beb8-aed9508bc794
status: experimental
description: >
  Detects single failed logon, for use in brute force correlation rule.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
level: informational
fields:
  - EventID
  - TargetUserName
  - WorkstationName
  - IpAddress
---
title: Brute Force - Password spraying
name: potential_bruteforce_spraying
id: 808f826c-4414-4f2b-b500-546b61dc4494
status: experimental
description: >
  Detects multiple logon attempts targeting multiple users within a short timeframe. (Potential bruteforce attack)
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
correlation:
  type: event_count
  rules:
    - failed_logon
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    gte: 10
level: high
