title: Brute Force - Succesful Password Spraying
name: succesful_bruteforce_spraying
id: c740ff65-0a05-44e5-82f4-093e60129d6a
status: experimental
description: >
  Detects multiple logon attempts targeting a multiple users within a short timeframe,
  followed by a succesful logon event coming from the same IP (succesful bruteforce attack)
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
correlation:
  type: temporal
  rules:
    - potential_bruteforce_spraying
    - succesful_logon
  group-by:
    - IpAddress
  timespan: 5m
level: critical
