title: Brute Force - Succesful Password Guessing
name: succesful_bruteforce_guessing
id: 80c54852-20aa-4316-9af7-f1978062cecb
status: experimental
description: >
  Detects multiple logon attempts targeting a single user within a short timeframe,
  followed by a succesful logon event coming from the same IP (succesful bruteforce attack)
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
correlation:
  type: temporal
  rules:
    - potential_bruteforce_guessing
    - succesful_logon
  group-by:
    - IpAddress
    - TargetUserName
  timespan: 5m
level: critical
