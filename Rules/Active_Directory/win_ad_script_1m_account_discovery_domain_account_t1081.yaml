title: Account Discovery - Domain Account - Powershell Script
id: 8f9ba4cc-6b81-49a0-a680-c2434768d773
status: experimental
description: >
  Detects adversaries using powershell scripts to discover AD users and groups.
  This rule looks for multiple suspicious discovery script executions within 1 minute.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://lolad-project.github.io/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1087.002
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    eventID: 4104
    Image|endswith:
      - powershell.exe
      - pwsh.exe
    CommandLine|contains:
      - Get-AD
      - Search-AD
  condition: selection | count() > 5
  timeframe: 1m
falsepositives:
  - Unknown
fields:
  - Commandline
  - Image
  - User
