title: Account Discovery - Domain Account - Powershell Script (Base Rule)
name: discovery_script
id: 8f9ba4cc-6b81-49a0-a680-c2434768d773
status: experimental
description: >
  Detects adversaries using powershell scripts to discover AD users and groups.
  This rule looks for multiple suspicious discovery script executions within 1 minute.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://lolad-project.github.io/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1087.002
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    action.id: 4104
    process.name:
      - powershell.exe
      - pwsh.exe
    action.properties.ScriptBlockText|contains:
      - Get-AD
      - Search-AD
  condition: selection
fields:
  - action.properties.ScriptBlockText
  - process.name
  - user.name
---
title: Account Discovery - Domain Account - Powershell Script
id: c05c1302-0200-4030-9e09-9d235b258f83
status: experimental
description: >
  Detects adversaries using powershell scripts to discover AD users and groups.
  This rule looks for multiple suspicious discovery script executions within 1 minute.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://lolad-project.github.io/
author: Louis Ingelbrecht
date: 2026-05-18
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1087.002
correlation:
  type: event_count
  rules:
    - discovery_script
  group-by:
    - user.name
  timespan: 1m
  condition:
    gte: 5
fields:
  - action.properties.ScriptBlockText
  - process.name
  - user.name