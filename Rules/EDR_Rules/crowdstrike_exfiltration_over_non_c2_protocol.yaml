title: Exfiltration Over Non-C2 Protocol
id: 8e76bb54-39a7-49f5-91a3-fe1464890a4c
status: experimental
description: >
  Native SentinelOne rule to detect non-browser processes making outbound network connections on ports associated with web traffic, which could indicate attempts to establish a C2 connection.
  This rule is designed to trigger an alert that is forwarded to the SIEM. (For correlation with Fortigate events)
references: 
  - https://attack.mitre.org/techniques/T1048/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags: 
  - attack.exfiltration
  - attack.t1048
  - attack.t1048.003
platform: crowdstrike
query_language: falcon logscale
query: >
  #event_simpleName=NetworkConnectIP4
  | in(field="ContextBaseFileName", values=["curl.exe", "powershell.exe", "pwsh.exe", "certutil.exe"])
  | in(field="RemoteAddressIP4", values=["172.17.80.*"])
response:
  action: generate_alert
  severity: Low
  alert_name: Exfiltration over non-C2 Protocol