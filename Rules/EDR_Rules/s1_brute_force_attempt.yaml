title: Potential Brute Force Attack (Password guessing/Spraying)
id: 88845081-9911-47bf-80a7-9630b74a6de4
status: experimental
description: >
  Native SentinelOne rule to detect multiple failed login attempts within a short period of time. Detects login attempts coming from a single IP, detecting both password guessing and spraying techniques.
  This rule is designed to trigger an alert that is forwarded to the SIEM. 
references: 
  - https://attack.mitre.org/techniques/T1110/001/
  - https://attack.mitre.org/techniques/T1110/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags: 
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - attack.t1110.003
platform: sentinelone
rule_type: correlation
query_language: s1ql
correlation_entity: IP
match_in_order: true
time_window: 10m
sub_queries:
  - step: 1
    query: event.type = 'Login' event.login.loginIsSuccessful = 'false'
    threshold: 10 matches
response:
  action: generate_alert
  severity: Medium
  alert_name: Potential Brute Force Attack