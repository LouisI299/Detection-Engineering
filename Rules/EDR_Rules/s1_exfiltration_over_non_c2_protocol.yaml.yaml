title: Exfiltration Over Non-C2 Protocol
id: 727b0935-4459-46ca-933c-5016911d13fc
status: experimental
description: >
  Native SentinelOne rule to detect non-browser processes making outbound network connections.
  This rule is designed to trigger an alert that is forwarded to the SIEM. (For correlation with Fortigate events)
references: 
  - https://attack.mitre.org/techniques/T1048/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags: 
  - attack.exfiltration
  - attack.t1048
  - attack.t1048.003
platform: sentinelone
query_language: s1ql
query: >
  event.type = 'IP Connect' and src.process.name in ('powershell.exe' , 'curl.exe', 'pwsh.exe', 'certutil.exe') and dst.ip.address != '172.17.70.*' and dst.ip.address != '172.17.60.*'
response:
  action: generate_alert
  severity: Low
  alert_name: Exfiltration over non-C2 Protocol

