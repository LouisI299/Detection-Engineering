title: Brute Force Attempt
id: f3899f90-03a2-4bf5-b4b7-848f7ceb969c
status: experimental
description: >
  Native Crowdstrike rule to detect multiple failed login attempts within a short period of time. Detects login attempts coming from a single IP, detecting both password guessing and spraying techniques.
  This rule is designed to trigger an alert that is forwarded to the SIEM. 
references: 
  - https://attack.mitre.org/techniques/T1110/001/
  - https://attack.mitre.org/techniques/T1110/003/
author: Louis Ingelbrecht
date: 2026-05-18
tags: 
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - attack.t1110.003
platform: crowdstrike
query_language: falcon logscale
query: >
  #event_simpleName="UserLogonFailed"
  | groupBy([RemoteAddressIP4], function=[count(as="FailedCount")])
  | FailedCount >= 10
response:
  action: generate_alert
  severity: Medium
  alert_name: Brute Force Attempt